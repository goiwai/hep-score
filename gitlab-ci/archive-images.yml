archive_images:
  image: gitlab-registry.cern.ch/hep-benchmarks/hep-workloads/hep-workload-builder-multiarch:latest
  stage: archive-images
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "BMK-1434"
  variables: 
    default_config: ${CI_PROJECT_DIR}/tests/etc/hepscore_conf_ci_helloworld.yaml
    workdir: /tmp/HEPSCORE/$CI_JOB_ID
    architecture: "x86_64"
    remote_archive: ${CI_WEB_RELEASES}/../images/archives
  script:
    - cd $CI_PROJECT_DIR
    - pip install .
    - python hepscore/archive_images.py -i ${default_config} -w ${workdir} -a ${architecture} -r ${remote_archive}
  after_script:
    - tar -czf archive_images.tgz /tmp/HEPSCORE/$CI_JOB_ID
  artifacts:
      paths:
        - archive_images.tgz
      expire_in: 1 week
      when: always
  parallel:
    matrix:
      - architecture: ["x86_64", "aarch64"]
        
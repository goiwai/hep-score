hepscore:
  settings:
    name: HEPscoreCI
    reference_machine: 'Unknown'
    registry:
      - oras://gitlab-registry.cern.ch/hep-benchmarks/hep-workloads-sif
      - docker://gitlab-registry.cern.ch/hep-benchmarks/hep-workloads
      - dir:///cvmfs/unpacked.cern.ch/gitlab-registry.cern.ch/hep-benchmarks/hep-workloads
    addarch: true
    scaling: 10
    repetitions: 1  #number of repetitions of the same benchmark
    method: geometric_mean #or any other algorithm
    container_exec: singularity
  options:
    container_uri: oras
  benchmarks:
    cms-flowsim-bmk:
      results_file: cms-flowsim_summary.json
      gpu: true
      ref_scores:
        flowsim: 1
      version: ci-v0.1
      args:
        threads: 4
        copies: 1
        extra-args: '--device cuda --n-objects 40000 --batch-size 20000 --n-model-instances 1'
